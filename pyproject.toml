[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-image"
version = "0.1.0"
description = "Reproducible full-suite benchmarks for text-to-image generators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "pandas>=2",
  "Pillow>=10",
  "tqdm>=4",
]

[project.scripts]
benchmark-image = "benchmark_image.cli:main"
benchmark-image-score = "benchmark_image.score_existing:main"
benchmark-image-official = "benchmark_image.official_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["benchmark_image*"]

[tool.setuptools.package-data]
benchmark_image = ["assets/**/*.json", "assets/**/*.jsonl", "assets/**/*.txt", "workers/*.py"]
